name: Update news

on:
  schedule:
    - cron: "4-59/10 * * * *"   # backup timer, every 10 minutes (GitHub may run it late)
  workflow_dispatch:            # also how each run starts the next one
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest headlines
        run: python scripts/fetch_news.py

      - name: Save headlines to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json docs/edition.json docs/index.html docs/sitemap.xml docs/briefing docs/about docs/pick
          if ! git diff --cached --quiet; then
            git commit -m "Update news"
            git pull --rebase --autostash || true
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

  next:
    # Starts the next update about 10 minutes from now, so updates keep coming
    # even when GitHub's own timer is late. Runs even if the update above failed.
    needs: update
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Wait, then start the next update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 510
          gh workflow run update-news.yml --repo "$GITHUB_REPOSITORY" --ref main
