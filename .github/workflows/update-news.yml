name: Update news

on:
  schedule:
    - cron: "4-59/10 * * * *"   # backup timer, every 10 minutes (GitHub may run it late)
  workflow_dispatch:            # also how each run starts the next one
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch latest headlines
        run: python scripts/fetch_news.py

      - name: Save headlines to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json docs/edition.json docs/index.html docs/sitemap.xml docs/briefing docs/about docs/pick docs/archive
          if ! git diff --cached --quiet; then
            git commit -m "Update news"
            git pull --rebase --autostash || true
            git push
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  next:
    # Starts the next update about 10 minutes from now, so updates keep coming
    # even when GitHub's own timer is late. Runs even if the update above failed.
    needs: update
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Wait, then start the next update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 510
          gh workflow run update-news.yml --repo "$GITHUB_REPOSITORY" --ref main
